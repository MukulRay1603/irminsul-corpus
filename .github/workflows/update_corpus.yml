name: Weekly Corpus Update

on:
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday 2am UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  update-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize git submodules
        run: |
          git submodule update --init --recursive
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize KQM TCL submodule
        run: |
          git submodule update --init --recursive --remote vendor/TCL || true
          if [ ! -d "vendor/TCL/docs" ]; then
            python pipeline/1_setup_tcl.py --init || true
          fi

      - name: Run pipeline — discover new characters
        run: python run_pipeline.py --steps discover

      - name: Run pipeline — TCL theorycrafting
        run: python run_pipeline.py --steps tcl
        continue-on-error: true

      - name: Run pipeline — structured game data
        run: python run_pipeline.py --steps structured

      - name: Run pipeline — wiki scraper
        # Incremental: skips unchanged, updates changed, fetches new
        run: python run_pipeline.py --steps wiki

      - name: Commit updated docs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/last_run.json 2>/dev/null || true
          git add docs/wiki/name_cache.json 2>/dev/null || true
          git add docs/wiki/new_characters.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit, skipping push"
            exit 0
          fi
          git commit -m "chore: weekly corpus update $(date -u '+%Y-%m-%d')"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Ingest into Pinecone
        run: python run_pipeline.py --steps ingest
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
